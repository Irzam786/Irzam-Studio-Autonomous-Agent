name: Build Irzam Studio AI Studio ZIP

on:
  push:
    branches:
      - ai-studio-import-ready
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import-ready branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript validation
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Create clean source ZIP
        run: |
          mkdir -p "$RUNNER_TEMP/irzam-studio"
          rsync -a --exclude='node_modules' --exclude='dist' --exclude='.git' --exclude='.env' --exclude='.env.*' ./ "$RUNNER_TEMP/irzam-studio/"
          cp .env.example "$RUNNER_TEMP/irzam-studio/.env.example"
          cd "$RUNNER_TEMP"
          zip -qr "$GITHUB_WORKSPACE/Irzam-Studio-AI-Studio-Import.zip" irzam-studio
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: irzam-studio-ai-studio-import
          path: Irzam-Studio-AI-Studio-Import.zip
          if-no-files-found: error
