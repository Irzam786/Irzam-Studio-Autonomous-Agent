name: Irzam Studio Netlify CI

on:
  push:
    branches:
      - netlify-ready
  pull_request:
    branches:
      - netlify-ready
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript validation
        run: npm run lint
      - name: Verify Netlify Function CommonJS bundle
        run: |
          npx esbuild netlify/functions/api.ts --bundle --platform=node --target=node22 --format=cjs --external:express --outfile=/tmp/irzam-netlify-api.cjs --metafile=/tmp/irzam-netlify-api-meta.json
          node -e "const meta = require('/tmp/irzam-netlify-api-meta.json'); const inputs = Object.keys(meta.inputs); const blocked = inputs.filter((p) => /node_modules\\/(vite|@vitejs\\/devtools)\\//.test(p)); if (blocked.length) { console.error('Unexpected Vite dependencies in function bundle:', blocked); process.exit(1); } console.log('CommonJS function bundle passed; Vite is not in the dependency graph.');"
      - name: Production frontend build
        run: npm run build
