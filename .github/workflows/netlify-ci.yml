name: Irzam Studio Netlify CI

on:
  push:
    branches:
      - netlify-ready
  pull_request:
    branches:
      - netlify-ready
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript validation
        run: npm run lint
      - name: Production frontend build
        run: npm run build
