name: Irzam Studio Background Outreach

on:
  schedule:
    - cron: '0 */1 * * *' # Har 1 ghante baad chalega
  workflow_dispatch: # Manual test button

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase

      # Step A: Pehle scraper run karke naye leads collect karega
      - name: Fetch New Leads
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scraper.py

      # Step B: Phir outreach worker baki bache pending leads ko email bhejega
      - name: Run Cold Outreach Worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python agent_worker.py
