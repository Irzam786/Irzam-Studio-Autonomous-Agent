name: Irzam Studio Background Outreach

on:
  schedule:
    - cron: '0 */1 * * *' # Every 1 hour
  workflow_dispatch: # Manual run button

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase pytz

      # Step A: Run Scraper (Logic only executes at 5 PM PKT inside scraper.py)
      - name: Fetch New Leads
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scraper.py

      # Step B: Run Worker (Email check 24/7 & Outreach from 6 PM PKT)
      - name: Run Outreach Worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python agent_worker.py
