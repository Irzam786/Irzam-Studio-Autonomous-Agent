<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181822"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </radialGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Glowing Aura behind star -->
  <circle cx="256" cy="256" r="110" fill="#ffffff" fill-opacity="0.08" filter="url(#glowEffect)"/>

  <!-- Official Irzam Studio Minimalist Star (✦) -->
  <path d="M 256 64 C 256 168 256 256 360 256 C 256 256 256 344 256 448 C 256 344 256 256 152 256 C 256 256 256 168 256 64 Z" 
        fill="url(#starGlow)" 
        filter="url(#glowEffect)"/>
</svg>
